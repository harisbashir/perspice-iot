# Scrapes every Perspice process on the Compose network (all replicas of each service).
global:
  scrape_interval: 15s
  evaluation_interval: 15s

scrape_configs:
  - job_name: perspice
    metrics_path: /metrics
    dns_sd_configs:
      - names: [api, ingest, rules, scheduler, renderer]
        type: A
        port: 3000
        refresh_interval: 30s
    relabel_configs:
      - source_labels: [__meta_dns_name]
        target_label: service
  - job_name: prometheus
    static_configs:
      - targets: ['localhost:9090']
