name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

jobs:
  images:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        image: [server, web, renderer]
    steps:
      - uses: actions/checkout@v4
      - name: Check the tag matches VERSION
        id: version
        run: |
          test "v$(cat VERSION)" = "${GITHUB_REF_NAME}"
          echo "version=$(cat VERSION)" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: deploy/Dockerfile.${{ matrix.image }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/perspice-${{ matrix.image }}:${{ steps.version.outputs.version }}
            ghcr.io/${{ github.repository_owner }}/perspice-${{ matrix.image }}:latest
          cache-from: type=gha,scope=${{ matrix.image }}
          cache-to: type=gha,mode=max,scope=${{ matrix.image }}

  # The real scripts on a clean Ubuntu: a fresh install of this release, and upgrades from the
  # first and the previous releases, each followed by a failed update that must roll back.
  install-e2e:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        from: [HEAD, v0.1.0, v0.8.0, v1.0.2, v1.0.3]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: bash deploy/test/install-e2e.sh --from ${{ matrix.from }}

  release:
    runs-on: ubuntu-latest
    needs: [images, install-e2e]
    steps:
      - uses: actions/checkout@v4
      - name: Release notes from CHANGELOG.md
        run: |
          version="${GITHUB_REF_NAME#v}"
          awk -v v="$version" '$0 ~ "^## \\[" v "\\]" {on=1; next} /^## \[/ {on=0} on' CHANGELOG.md > notes.md
      - uses: softprops/action-gh-release@v2
        with:
          body_path: notes.md
